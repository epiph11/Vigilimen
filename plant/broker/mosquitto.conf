# Mosquitto 2.x, the DMZ broker (ADR-020 point 2, hardening-targets.md row 1 and 2).
# Written 18 Nov 2026, NOT run: there is no broker service in the compose yet.
#
# What this enforces:
#   - ONE listener, 8883, TLS. No 1883, no websockets, no anonymous access, no password file.
#   - Mutual TLS: a client without a certificate signed by the lab CA is refused at the handshake.
#   - The client's identity is the certificate CN (use_identity_as_username), and the ACL is keyed on it.
#   - A certificate on the CRL is refused. WHETHER Mosquitto re-reads the CRL without a restart is NOT verified.
#   - TLS version: no tls_version line on purpose. Mosquitto 2.x then offers TLS 1.2 and 1.3 only; a line
#     "tls_version tlsv1.2" would FORBID 1.3. To confirm live: openssl s_client -tls1_1 must fail.
#   - Limits: small messages, few connections, no retained telemetry, bounded queues.
# Paths are the files mqttpki.py writes into the broker folder, mounted read-only at /mosquitto/certs.

per_listener_settings true

listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
crlfile /mosquitto/certs/crl.pem
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /mosquitto/config/acl

# Limits (global).
message_size_limit 4096
max_connections 10
max_inflight_messages 20
max_queued_messages 1000
retain_available false

# The edge uses a fixed client id and a persistent session (store and forward, ADR-020 point 7).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
