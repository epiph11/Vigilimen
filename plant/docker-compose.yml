# CONV-001 — site in a box.
#
#   docker compose up -d
#   docker compose logs -f gateway
#
# Everything here runs on one machine and costs nothing (ADR-004: the
# persistent spine is local). Nothing in this file touches a cloud account.
#
# ─────────────────────────────────────────────────────────────────────────
#  THE NETWORK LAYOUT IS THE POINT
#
#  Three networks, and a container's membership is its zone. This is the
#  provisional partition from VIGILIMEN-ARC-006 made real enough to attack:
#
#      net_control      PLC, gateway, fw-cell   internal: no route to the outside
#      net_supervisory  fw-cell, opcua-sup, SCADA, historian, collector   internal (ADR-020 Q1 = a)
#      net_safety       SIS ONLY — one member, internal, no gateway
#      net_edgelink     opcua-sup and (S5) the edge ONLY — internal. Added 18 Nov 2026 (dmz-target.md 7.7): Docker
#                       gives every service on a network access to every other one on all ports, so the edge
#                       gets its own link to opcua-sup instead of joining net_supervisory.
#
#  S5 adds net_dmz (internal: edge, broker) and net_hostleg (NOT internal, lab artifice, broker only).
#  The broker is in this file since 18 Nov 2026 (written, not run); the edge follows. FF-22 pins membership.
#
#  ADR-023 (accepted 15 Nov 2026): the gateway is on net_control ONLY. The one door of
#  the cell is fw-cell, the only service on both net_control and net_supervisory. What
#  only reads (collector, SCADA read view) reads opcua-sup, which has no command node.
#
#  net_safety is declared `internal: true` and has exactly one container on
#  it. That is not belt-and-braces: the safety controller's independence is
#  the one property that must survive an adversary already inside the
#  control network (ADR-011), and a shared bridge would quietly hand it
#  away while every diagram still showed it separate.
# ─────────────────────────────────────────────────────────────────────────

name: vigilimen-plant

networks:
  net_control:
    driver: bridge
    internal: true          # no route off the host. The gateway is the only way out.
  net_supervisory:
    driver: bridge
    internal: true          # ADR-020 Q1 = a, ADR-023. Host access to FUXA, the database and OPC UA goes
                            # through tools/supervisory-relay.ps1, because Docker ignores `ports:` here.
  net_safety:
    driver: bridge
    internal: true          # SIS-CONV-001 is alone here, and stays alone.
  net_edgelink:
    driver: bridge
    internal: true          # opcua-sup and the edge, nothing else (dmz-target.md 7.7). The edge has no
                            # route to scada, historian or collector, and none off the host.
  net_dmz:
    driver: bridge
    internal: true          # the edge and the broker, nothing else (ADR-020 point 8). No route off the host.
  net_hostleg:
    driver: bridge          # NOT internal: a lab artifice. Docker publishes a port only from a non-internal
                            # network, so the broker has this leg to be reachable on 127.0.0.1:18883. The edge
                            # must never be on it (FF-22). A real DMZ would not have this default route.

volumes:
  historian_data:
  fuxa_data:
  pki:                    # lab certificates (ADR-023 point 7), generated by pki-init, never committed
  pki-mqtt:               # MQTT lab CA and its certificates (ADR-020 point 2), generated by pki-init, never committed
  broker_data:            # Mosquitto persistent sessions (the edge's store and forward relies on them)

services:

  # ---------------------------------------------------------------------
  # L1 — the two controllers
  # ---------------------------------------------------------------------

  plc-control:
    # PLC-CONV-001. Loads plant/plc-control/conveyor.st through the OpenPLC
    # web UI on :8080 the first time — the runtime has no headless import.
    image: openplc:v3
    container_name: vigilimen-plc-control
    hostname: plc-conv-001
    networks: [net_control]
    ports:
      - "127.0.0.1:8081:8080"     # OpenPLC web UI, LOOPBACK ONLY
      - "127.0.0.1:15020:502"     # Modbus TCP
    volumes:
      - ./plc-control:/programs:ro
    restart: unless-stopped

  plc-safety:
    # SIS-CONV-001. Same image, separate runtime, separate network, and
    # NOTHING ELSE ON IT. Its Modbus port is deliberately not published —
    # there is nobody on net_safety to talk to it, which is the design.
    image: openplc:v3
    container_name: vigilimen-plc-safety
    hostname: sis-conv-001
    networks: [net_safety]
    ports:
      - "127.0.0.1:8082:8080"     # web UI for loading safety.st, loopback only
    volumes:
      - ./plc-safety:/programs:ro
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # L1.5 — the protocol break
  # ---------------------------------------------------------------------

  pki-init:
    # One-shot. Writes the lab application certificates and the trust lists into the `pki` volume, one
    # folder per service (ADR-023 point 7). Self-signed, lab only: see plant/pki/uasec.py for what this is
    # not. No network at all, and it exits when done. Keys exist only in the volume, never in git (FF-03).
    build:
      context: .
      dockerfile: pki/Dockerfile
    container_name: vigilimen-pki-init
    network_mode: none
    volumes:
      - pki:/pki
      - pki-mqtt:/pki-mqtt
    restart: "no"

  gateway:
    # On net_control ONLY (ADR-023). Its neighbours are the PLC and fw-cell. Every north-south
    # flow still passes through it, which makes it a conduit in the 62443 sense; the policy point
    # in front of it is fw-cell. Readers do not connect here: they read opcua-sup.
    build:
      # Context is plant/, not plant/gateway/. The gateway imports the
      # physics and interlock models from ../sim, and a Dockerfile cannot
      # COPY above its own context. The alternative — a second copy of the
      # simulation inside gateway/ — is how two models of the same machine
      # start disagreeing.
      context: .
      dockerfile: gateway/Dockerfile
    container_name: vigilimen-gateway
    hostname: gateway
    networks: [net_control]
    environment:
      # A SERVICE name, not the PLC's `hostname:`. Docker's DNS answers for service
      # names, container names and network aliases, and NOT for a container's
      # hostname: the old value (plc-conv-001) would not have resolved from here.
      # FF-22 checks that this names something Docker can resolve on net_control.
      VIGILIMEN_MODBUS_HOST: plc-control
      VIGILIMEN_MODBUS_PORT: "502"
      # CONTROL FUNCTION (ADR-013). `modbus`: PLC-CONV-001 decides, over Modbus, and the belt will NOT run
      # until its program is loaded and started (PlcLinkOK stays False: that is the fail-safe working).
      # `off`: the embedded Python model plays both controllers, with no PLC involved. Use it as a
      # zero-setup baseline or to tell a gateway fault from a PLC fault:
      #   $env:VIGILIMEN_PLC_LINK = 'off'; docker compose up -d
      # The mode is printed in the gateway's start-up line.
      VIGILIMEN_PLC_LINK: ${VIGILIMEN_PLC_LINK:-modbus}
      TZ: Australia/Brisbane      # display only. Stored values are UTC (ADR-010).
    volumes:
      - type: volume
        source: pki
        target: /pki
        read_only: true
        volume:
          subpath: gateway          # this service sees only its own folder of keys and trust lists
    depends_on:
      plc-control:
        condition: service_started
      pki-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # The door of the cell and the read-only supervisory server (ADR-023)
  # ---------------------------------------------------------------------

  fw-cell:
    # Cell firewall (FW-CELL-001, -002, -DEFAULT). nftables default deny plus a TCP relay on 4840
    # to the gateway. The ONLY service on both net_control and net_supervisory. It needs NET_ADMIN
    # to load its rules and SETUID/SETGID to run the relay unprivileged; FF-22 allows exactly
    # these three capabilities for this one service and for nothing else.
    build:
      context: .
      dockerfile: fw-cell/Dockerfile
    container_name: vigilimen-fw-cell
    hostname: fw-cell
    networks: [net_control, net_supervisory]
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    sysctls:
      net.ipv4.ip_forward: "0"      # nothing is routed: the cell is reachable only through the relay
    environment:
      FW_UPSTREAM_HOST: gateway
      FW_F8_SOURCE: opcua-sup       # FW-CELL-001, the read path
      FW_F9_SOURCE: scada           # FW-CELL-002, the operator command path
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

  opcua-sup:
    # Read-only supervisory OPC UA server (OT-OPC-01). No command node, no fault node: read-only is
    # a property of the address space. It reads the gateway THROUGH fw-cell (F8) and serves the
    # collector (F1), the SCADA read view and, later, the edge (F-01R).
    build:
      context: .
      dockerfile: opcua-sup/Dockerfile
    container_name: vigilimen-opcua-sup
    hostname: opcua-sup
    networks: [net_supervisory, net_edgelink]   # the second leg is the edge's link (S5); a registered conduit component
    environment:
      VIGILIMEN_UPSTREAM_URL: opc.tcp://fw-cell:4840/vigilimen/conv001/
      VIGILIMEN_UPSTREAM_USER: opcua-sup
      VIGILIMEN_UPSTREAM_PASSWORD: sup-m1rr0r-demo
      TZ: UTC
    volumes:
      - type: volume
        source: pki
        target: /pki
        read_only: true
        volume:
          subpath: opcua-sup          # this service sees only its own folder of keys and trust lists
    depends_on:
      fw-cell:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # L2 / L3 — supervision and history
  # ---------------------------------------------------------------------

  scada:
    # FUXA, MIT-licensed. The licence is the decision, not the features —
    # see ADR-012.
    # Built from scada/Dockerfile: FUXA pinned by digest + the OPC UA driver installed at build time
    # (the stock image downloads it at runtime, impossible on an internal network).
    build:
      context: ./scada
    image: vigilimen-plant-scada
    container_name: vigilimen-scada
    hostname: scada
    networks: [net_supervisory]
    ports:
      - "127.0.0.1:1881:1881"     # ignored by Docker while net_supervisory is internal: use tools/supervisory-relay.ps1
    volumes:
      - fuxa_data:/usr/src/app/FUXA/server/_appdata
      - ./scada/project:/usr/src/app/FUXA/server/_project
      - type: volume
        source: pki
        target: /pki
        read_only: true
        volume:
          subpath: scada          # this service sees only its own folder of keys and trust lists
    environment:
      TZ: Australia/Brisbane
    depends_on:
      pki-init:
        condition: service_completed_successfully
    restart: unless-stopped

  historian:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: vigilimen-historian
    hostname: historian
    networks: [net_supervisory]
    ports:
      - "127.0.0.1:15432:5432"    # ignored by Docker while net_supervisory is internal: use tools/supervisory-relay.ps1
    environment:
      POSTGRES_DB: vigilimen
      POSTGRES_USER: vigilimen
      # Local-only, loopback-bound, no data of any value. A real deployment
      # takes this from the identity authority (ADR-008). FF-03 permits it
      # here because it is an environment default in a compose file for a
      # simulated plant, not a credential in the source tree.
      POSTGRES_PASSWORD: vigilimen-local-only
      TZ: UTC                     # the database stores UTC. Always.
    volumes:
      - historian_data:/var/lib/postgresql/data
      - ./historian/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      # pg_isready, and only after the init scripts have run — the entrypoint
      # starts a temporary server to apply schema.sql, so a naive check goes
      # green while the tables do not yet exist.
      test: ["CMD-SHELL", "pg_isready -U vigilimen -d vigilimen && psql -U vigilimen -d vigilimen -c 'SELECT 1 FROM tag LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  collector:
    # Reads opcua-sup over OPC UA at 1 Hz (ADR-023, F1) and writes to the historian.
    # Deliberately a separate container from the gateway: the thing that
    # PERSISTS data and the thing that BRIDGES protocols fail differently,
    # and collapsing them means a historian outage takes the plant's
    # supervision with it.
    build:
      context: .
      dockerfile: historian/Dockerfile
    container_name: vigilimen-collector
    # The gateway is `service_healthy`, not `service_started`. depends_on
    # without a condition only waits for the container to exist, and a
    # collector that connects 200 ms before the OPC UA endpoint is listening
    # spends its first five seconds in the reconnect loop for no reason.
    hostname: collector
    networks: [net_supervisory]
    environment:
      VIGILIMEN_OPCUA_URL: opc.tcp://opcua-sup:4840/vigilimen/conv001/
      VIGILIMEN_OPCUA_USER: historian
      VIGILIMEN_OPCUA_PASSWORD: h1st0r1an-demo
      VIGILIMEN_PGDSN: postgresql://vigilimen:vigilimen-local-only@historian:5432/vigilimen
      # Alarm state in the database (ADR-019). A volume created before it needs
      # historian/migrations/001_alarm_state.sql once; the collector says so if it is missing.
      VIGILIMEN_ALARM_PERSIST: ${VIGILIMEN_ALARM_PERSIST:-on}
      TZ: UTC
    volumes:
      - type: volume
        source: pki
        target: /pki
        read_only: true
        volume:
          subpath: collector      # this service sees only its own folder of keys and trust lists
    depends_on:
      pki-init:
        condition: service_completed_successfully
      opcua-sup:
        condition: service_healthy
      historian:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # DMZ — S5 (ADR-020). The broker first; the edge arrives next.
  # ---------------------------------------------------------------------

  broker:
    # Mosquitto 2.x. WRITTEN 18 Nov 2026, NOT RUN. The tag is provisional: pin by digest with FF-20.
    # Mutual TLS, ACL keyed on the certificate CN, CRL: see broker/mosquitto.conf (FF-37).
    # On net_dmz (internal) and net_hostleg (lab artifice, so that Docker can publish the port).
    image: eclipse-mosquitto:2.0.20
    container_name: vigilimen-broker
    hostname: broker
    user: "1883:1883"            # never root: the image would chown and then drop privileges, which cap_drop ALL forbids
    networks: [net_dmz, net_hostleg]
    ports:
      - "127.0.0.1:18883:8883"     # TLS only. There is no 1883 anywhere (FF-22, FF-37).
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/acl:/mosquitto/config/acl:ro
      - type: volume
        source: pki-mqtt
        target: /mosquitto/certs
        read_only: true
        volume:
          subpath: broker         # the broker sees only its own folder: no CA key, no client key
      - broker_data:/mosquitto/data
    environment:
      TZ: UTC
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    depends_on:
      pki-init:
        condition: service_completed_successfully
    # Weak by design: "the TLS port is open". A real check needs a client certificate, which the broker
    # folder does not hold. The live proof is the broker FF (to write), not this line.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8883 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

# ---------------------------------------------------------------------------
# WHAT IS DELIBERATELY ABSENT
#
#   No engineering workstation. It is a Windows VM and does not belong in
#   compose — it is brought up separately, which is honest: the asset that
#   matters most in every real ICS incident is also the one that does not
#   fit the container model.
#
#   No published port on anything except loopback. Every `ports:` entry
#   binds 127.0.0.1 explicitly. Docker's default binds 0.0.0.0, which
#   publishes a PLC's Modbus port to the local network and, behind some
#   router configurations, past it. That default has put real plant on the
#   internet, and `127.0.0.1:` is four characters.
# ---------------------------------------------------------------------------
