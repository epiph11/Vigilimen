# TEST OVERRIDE (FF-26, FF-28). Not part of the running design.
# fw-cell accepts F9 (commands) only from one source. In the design that source is `scada`.
# For the scripted end-to-end run the collector container plays the operator, so F9 is
# switched to `collector` for the duration of the test. While this override is up, FUXA
# cannot command the belt. Restore with:  docker compose up -d   (without this file)
services:
  fw-cell:
    environment:
      FW_F9_SOURCE: collector
  pki-init:
    # also issues a `tester` certificate to the collector container and puts it on the trust lists of the
    # gateway and opcua-sup. Without this file (docker compose up -d) pki-init rewrites the lists without it,
    # and because the servers re-read the trust folder at every session it is revoked at once.
    environment:
      VIGILIMEN_PKI_TESTER: "1"
